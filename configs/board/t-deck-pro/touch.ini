; LILYGO T-Deck Pro V1.1: the capacitive touch panel (CST3530, a CST66xx: the chip answers 0xCA 0xCA in its info) over the e-paper, on the I2C bus of the board, the pins of the vendor's
; example:
;   SDA = GPIO13, SCL = GPIO14, RST = GPIO38 (PC6), INT = GPIO12 (not used: the driver polls).
; GPIO32..47 are port C of dmgpio (pin=PC6 is GPIO38). The chip is at 0x1A (26). In the vendor's files for V1.0 of the board the reset is GPIO45 (PC13) - not tried.
; The bus is the board's one: the keyboard (TCA8418, 0x34), the battery gauge and charger (0x55, 0x6B), the IMU (0x28) and the haptic
; driver (0x5A) are on it too - each is a friend of its own driver, which opens the controller 1 of dmi2c as this section does.
;
; One friends_group: dmdevfs tells every driver of the group about the others, and the friend_role says who is who. The touch panel is the
; last section (the order of the sections is the order of the creation and, reversed, of the teardown). dmgpio and dmi2c must be loaded.
; width / height: the screen the contacts are reported in - those of the display as shown (the e-paper, rotation=0: 240x320).
; swap_xy / mirror_x / mirror_y turn the chip's axes to the screen's.

[touch_reset]
driver_name=dmgpio
driver_order=2
friends_group=touch
friend_role=reset
pin=PC6
mode=output
state=high

[touch_i2c]
driver_name=dmi2c
driver_order=2
friends_group=touch
friend_role=i2c
instance=1
role=master
address=26
baudrate=400000
timeout_ms=100
scl_pin=14
sda_pin=13

[touch]
driver_name=dmcst66xx
driver_order=3
friends_group=touch
width=240
height=320
reset=yes
